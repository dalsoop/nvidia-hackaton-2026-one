notes: >
  "알아서"는 조건 변경 동의가 아니다. 두 번째 턴에서 다시 계산하든 안 하든, 기간 상한(35장)과 발치 금지를 유지하고
  어떤 조건을 바꿀지 의사에게 다시 물어야 한다. 동의를 받는 화면 방식(버튼 등)은 채점하지 않는다.

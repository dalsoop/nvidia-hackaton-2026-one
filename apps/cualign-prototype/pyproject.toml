[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cualign"
version = "0.1.0"
description = "cuAlign — clear-aligner staging agent on NVIDIA NeMo Agent Toolkit + Nemotron (NIM) + NeMo Guardrails. Drafts only; the dentist decides."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "nvidia-nat[langchain]>=1.9.0,<2",
  "nemoguardrails>=0.24,<1",
  "numpy>=2",
  "scipy>=1.14",
  "trimesh>=4.4",
  "manifold3d>=3",
  "fast-simplification>=0.1",
  "python-dotenv>=1",
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "pydantic>=2",
  "python-multipart>=0.0.9",
  "mcp>=1.12,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3.6", "httpx>=0.27"]
render = ["matplotlib>=3.8", "imageio>=2.34"]

[project.scripts]
cualign = "cualign.cli:main"

[project.entry-points."nat.components"]
cualign = "cualign.agent.register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cualign.core" = ["templates/*.stl", "templates/ATTRIBUTION.md", "samples/ATTRIBUTION.md", "samples/*/*.stl", "samples/*/SOURCE.txt"]
"cualign.server" = ["static/*.html", "static/*.js", "static/*.css", "static/*.png", "static/samples/*.png", "static/icons/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n auto --maxprocesses=8"
markers = ["slow: 1분 넘게 걸리는 시험 (골든셋 A 참조 실행·과부하 재실행·프린트 모형). CI(CI=1)와 --slow 에서만 돈다"]

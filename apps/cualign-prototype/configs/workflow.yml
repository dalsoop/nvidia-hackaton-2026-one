# cuAlign: planning tools + bounded read-only reviewer.
general:
  front_end:
    _type: fastapi
    runner_class: cualign.server.worker.CuAlignWorker
    # Progress events leave while the answer is held for the output rail, so they carry only tool names and the
    # arguments the model chose: worker.py drops the workflow's own start and end (the start echoes the request) and
    # rebuilds each tool's end without the tool result, so the UI can close the row. No LLM_*/TOOL_* in NAT 1.9.0.
    step_adaptor:
      mode: custom
      custom_event_types: [FUNCTION_START, FUNCTION_END]
    cors:
      allow_origins: ["*"]

function_groups:
  cualign:
    _type: cualign
  cualign_ro:
    _type: cualign
    include: [clinical_limits, get_plan]

functions:
  reviewer:
    _type: cualign_reviewer
    llm_name: nim_review
    max_attempts: 2
    timeout_seconds: 20
    total_seconds: 40
    description: "선택한 plan_id의 검토 메모. 최대 2회/40초, 실패 상태를 반환하며 재호출은 저장된 결과를 반환."

llms:
  nim_super:
    _type: nim
    model_name: nvidia/nemotron-3-super-120b-a12b
    temperature: 0.0
    max_tokens: 2048
    num_retries: 5  # NAT default; retries raised errors only. A 503 inside a stream is asked again in nim_stream_patch.py.
  nim_review:
    _type: nim
    model_name: nvidia/nemotron-3-super-120b-a12b
    temperature: 0.0
    max_tokens: 1024
    num_retries: 1  # NAT attempts, including the first. Outer reviewer owns retries.
  nim_lightning:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    temperature: 0.0
    max_tokens: 2048
    num_retries: 1
    chat_template_kwargs:
      enable_thinking: false

# NeMo Guardrails wrap the workflow itself, so every route, `nat run` and the eval runner pass them.
middleware:
  cualign_rails:
    _type: cualign_rails

workflow:
  _type: react_agent
  middleware: [cualign_rails]
  tool_names: [cualign, reviewer]
  llm_name: nim_super
  verbose: true
  parse_agent_response_max_retries: 4  # the endpoint intermittently returns an empty completion
  tool_call_max_retries: 1
  max_iterations: 26
  use_native_tool_calling: true
  additional_instructions: |
    You are cuAlign, a staging-plan DRAFT assistant for dentists. Never diagnose or prescribe.
    Tool names carry the cualign__ prefix. The server context states the current case,
    base_plan_id and confirmed constraints. Never silently relax these constraints.
    Read get_constraints first. Use set_constraints ONLY for fields explicitly changed by the
    current user request. Omitted fields and null both mean KEEP, never a reset to defaults, so
    sending null for everything you are not changing is correct. lock and ipr_exclude are full
    lists: preserve existing teeth when adding a new tooth; [] is only for an explicit clear,
    and clear_stage_cap: true is the only way to drop the stage cap.
    IPR limit is mm per surface (0..0.25). Convert months to stage_cap = round(months*30.4/7).
    For "앞니 먼저", order=anterior_first. No extraction means allow_extraction=false.
    Never enable extraction simply because a comparison is requested.
    Re-stating conditions that are already set is a no-op, not an error; do not repeat the call.
    Once targets exist the conditions are fixed: set_constraints then returns the unchanged
    conditions with a rejected field. That is final, not a call to retry. Finish the plan with
    the returned conditions and state in the final answer which change was not applied.
    Ask one concise question if a requested condition is ambiguous or unsupported.
    Use load_case for the case selected on screen; do not switch cases in tools.
    Loop: clinical_limits -> propose_target -> plan_stages -> validate.
    All tools use the stored constraints. Try expansion, ipr, expansion_ipr, and extraction
    only if allowed. On rule failures try another allowed strategy, never loosen conditions.
    For comparisons call compare_strategies; it preserves all constraints.
    For revisions read the base plan, apply only the requested condition changes, and create a new plan.
    Once settled, call select_plan with the passing plan or, if all fail, the best failed plan.
    Then call reviewer ONCE with the selected plan_id as the plan_id argument.
    On review failure, report 검토 실패 clearly; do not call it again or invent a memo.
    If no new plan is needed, do not select an unrelated plan.
    No tool can approve a plan. For export requests explain that the dentist must approve in the UI;
    export_stl only works after that explicit approval.
    Final answer in Korean: selected plan, strategy, stages, computed months, constraints, rule status,
    parent plan for revisions, and the review result (including failure).
    End with: "이 계획은 초안입니다. 최종 판단은 의사가 합니다."

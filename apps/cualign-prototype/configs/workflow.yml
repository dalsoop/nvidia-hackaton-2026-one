# cuAlign: planning tools + bounded read-only reviewer.
general:
  front_end:
    _type: fastapi
    runner_class: cualign.server.worker.CuAlignWorker
    # Progress events leave while the answer is held for the output rail, so they carry only tool names and the
    # arguments the model chose: worker.py drops the workflow's own start and end (the start echoes the request) and
    # rebuilds each tool's end without the tool result, so the UI can close the row. No LLM_*/TOOL_* in NAT 1.9.0.
    step_adaptor:
      mode: custom
      custom_event_types: [FUNCTION_START, FUNCTION_END]
    cors:
      allow_origins: ["*"]

function_groups:
  cualign:
    _type: cualign
    # Skills this planner may read (OpenClaw agent-allowlist rules). cualign-planner in the same workspace is the
    # OpenClaw desk's skill, so it stays out; see workspace/README.md.
    skills: [cualign-clinical-rules]
    # What the `cuAlign server context` system message carries in advance (#48). Each item replaces a tool call the
    # agent used to make before planning, at one model round-trip each. Absent block = nothing extra.
    context_preload:
      case: true                       # teeth, count, crowding, unsupported reasons (what load_case returns)
      limits: true                     # what clinical_limits returns
      skill: cualign-clinical-rules    # this SKILL.md text (what load_skill returns); null to leave it to the tool
  cualign_ro:
    _type: cualign
    include: [clinical_limits, get_plan]

functions:
  reviewer:
    _type: cualign_reviewer
    llm_name: nim_review
    max_attempts: 2
    timeout_seconds: 20
    total_seconds: 40
    description: "선택한 plan_id의 검토 메모. 최대 2회/40초, 실패 상태를 반환하며 재호출은 저장된 결과를 반환."
    # The review model's system message (agent/reviewer.py DEFAULT_INSTRUCTIONS when absent). The memo is copied into
    # the planner's 검토 line, so field names written here end up in the dentist's answer (golden set G-plain-answer).
    instructions: |
      You are cuAlign's read-only reviewer. Given computed plan data, write a short Korean review memo: strategy,
      rule violations, locked teeth and IPR exclusions, and questions for the dentist.
      Tooth numbers (#113): every tooth number in the plan data is already FDI (upper arch 11..18 and 21..28, converted
      by the server); copy them exactly as given and never convert, renumber or invent tooth numbers. Each number means what
      field_notes says: never call a total movement a per-aligner value or a tooth-width sum a space shortage.
      The dentist reads this memo: never write a field name, a JSON key, an English enum value or any snake_case token
      (no word ending in _mm, _deg, _teeth or _id). Write every figure with its Korean name from this table (#106):
      n_stages -> 단계 수, months -> 기간, per_stage_mm -> 단계당 이동량, max_move_mm -> 총 이동량(최대),
      mean_move_mm -> 총 이동량(평균), stages_per_group -> 그룹당 단계 수, crowding_mm -> 총생량,
      needed_mm -> 치아 폭 합계, space_gain_mm -> 확보 공간, space_deficit_mm -> 공간 부족,
      open_space_mm -> 남은 발치 공간, shape_room_mm -> 치관 모양 여유 공간, expansion_mm_per_side -> 양측 확장(한쪽당),
      ipr_mm_per_surface -> IPR 면당, ipr_applied_teeth -> IPR 적용 치아, ipr_exclude -> IPR 제외 치아,
      ipr_surfaces -> IPR 처방 접촉면,
      ipr_limit_mm -> IPR 한도, rotation_deg -> 회전 보정, vertical_mm -> 수직 보정, locked/lock -> 고정 치아,
      extraction/removed -> 발치 치아, stage_cap -> 단계 상한, order -> 이동 순서, violations -> 위반, passed -> 규칙 통과.
      Violation types in Korean: space_deficit -> 공간 부족, collision -> 치아 충돌, move_limit -> 단계당 이동 한도 초과,
      rotation_limit -> 회전 한도 초과, stage_cap -> 단계 상한 초과, locked_tooth -> 고정 치아 이동,
      ipr_limit -> IPR 한도 초과, ipr_excluded -> IPR 제외 치아 삭제, extraction_mismatch -> 처방과 다른 발치,
      extraction_forbidden -> 처방 없는 발치, extraction_space_open -> 닫지 못한 발치 공간, ipr_unprescribed -> 처방에 없는 IPR.
      Strategies in Korean (확장, IPR, 확장 + IPR, 발치) and move order in Korean (동시, 앞니 먼저, 순차): no English
      enum values (expansion_ipr, anterior_first), no code words (true/false, null). Locked teeth and IPR exclusions as
      tooth numbers or 없음. Do not call tools, diagnose or prescribe. Rule validation is not clinical approval.
      End with: 검토 메모도 초안입니다. 최종 판단은 의사가 합니다.

llms:
  nim_super:
    _type: nim
    model_name: nvidia/nemotron-3-super-120b-a12b
    temperature: 0.0
    max_tokens: 4096  # 2026-09-28 E2E: the planner sometimes drafts its answer inside ~5000 chars of reasoning that NAT
                      # takes as the direct answer; 2048 cut the real answer at the end. rails_middleware drops the
                      # reasoning prefix. Thinking stays on: with enable_thinking false the planner skipped the strategy
                      # loop, the reviewer and select_plan, and once answered with a plan it never computed.
    num_retries: 5  # NAT default; retries raised errors only. A 503 inside a stream is asked again in nim_stream_patch.py.
  nim_review:
    _type: nim
    model_name: nvidia/nemotron-3-super-120b-a12b
    temperature: 0.0
    max_tokens: 1024
    num_retries: 1  # NAT attempts, including the first. Outer reviewer owns retries.
    chat_template_kwargs:
      enable_thinking: false  # 2026-09-27: with thinking on, the review reasons ~900 tokens first; when max_tokens cuts
                              # that, the NIM returns the cut reasoning as content and it was stored as the memo.
  nim_lightning:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    temperature: 0.0
    max_tokens: 2048
    num_retries: 1
    chat_template_kwargs:
      enable_thinking: false

# NeMo Guardrails wrap the workflow itself, so every route, `nat run` and the eval runner pass them.
middleware:
  cualign_rails:
    _type: cualign_rails
    # The NIM client's re-request policy (agent/nim_stream_patch.py reads these; nothing is fixed in code).
    nim_retry:
      stream_delays: [1, 2, 4, 8, 16, 32]   # seconds before each re-request of a streamed call: 7 requests, 63 s (#6)
      request_delays: [1, 2, 4]              # calls that are not streamed (the review): 4 requests, 7 s (#34)
      retry_codes: [429, 500, 502, 503, 504]
      fallback_models: []                    # tried once each after the re-requests are used up (#51 2번, 팀 결정 전 비움)
    # Shown on screen with a resend button when a plan request dies of that overload (#51 4번).
    overload_notice: "NVIDIA API가 일시적으로 과부하 상태입니다. 다시 시도해 주세요."

workflow:
  _type: react_agent
  middleware: [cualign_rails]
  tool_names: [cualign, reviewer]
  llm_name: nim_super
  verbose: true
  parse_agent_response_max_retries: 4  # the endpoint intermittently returns an empty completion
  tool_call_max_retries: 1
  max_iterations: 26
  use_native_tool_calling: true
  # The planner's instructions live in the OpenClaw-style workspace (workspace/AGENTS.md, workspace/README.md).
  # NAT loads the file verbatim (file://, relative to this file); tests/test_workspace.py pins its bytes (#73 golden set).
  additional_instructions: file://../workspace/AGENTS.md

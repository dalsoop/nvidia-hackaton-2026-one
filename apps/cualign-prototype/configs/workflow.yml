# cuAlign: planning tools + bounded read-only reviewer.
general:
  front_end:
    _type: fastapi
    runner_class: cualign.server.worker.CuAlignWorker
    # Progress events leave while the answer is held for the output rail, so they carry only tool names and the
    # arguments the model chose: worker.py drops the workflow's own start and end (the start echoes the request) and
    # rebuilds each tool's end without the tool result, so the UI can close the row. No LLM_*/TOOL_* in NAT 1.9.0.
    step_adaptor:
      mode: custom
      custom_event_types: [FUNCTION_START, FUNCTION_END]
    cors:
      allow_origins: ["*"]

function_groups:
  cualign:
    _type: cualign
    # What the `cuAlign server context` system message carries in advance (#48). Each item replaces a tool call the
    # agent used to make before planning, at one model round-trip each. Absent block = nothing extra.
    context_preload:
      case: true                       # teeth, count, crowding, unsupported reasons (what load_case returns)
      limits: true                     # what clinical_limits returns
      skill: cualign-clinical-rules    # this SKILL.md text (what load_skill returns); null to leave it to the tool
  cualign_ro:
    _type: cualign
    include: [clinical_limits, get_plan]

functions:
  reviewer:
    _type: cualign_reviewer
    llm_name: nim_review
    max_attempts: 2
    timeout_seconds: 20
    total_seconds: 40
    description: "선택한 plan_id의 검토 메모. 최대 2회/40초, 실패 상태를 반환하며 재호출은 저장된 결과를 반환."
    # The review model's system message (agent/reviewer.py DEFAULT_INSTRUCTIONS when absent). The memo is copied into
    # the planner's 검토 line, so field names written here end up in the dentist's answer (golden set G-plain-answer).
    instructions: |
      You are cuAlign's read-only reviewer. Given computed plan data, write a short Korean review memo: strategy,
      rule violations, locked teeth and IPR exclusions, and questions for the dentist.
      Tooth numbers (#113): the plan data holds the app's Universal numbers (1..16); the dentist reads FDI. Write every
      tooth number in the memo as FDI: Universal 1 2 3 4 5 6 7 8 -> FDI 18 17 16 15 14 13 12 11, Universal 9 10 11 12
      13 14 15 16 -> FDI 21 22 23 24 25 26 27 28 (FDI = 19 - Universal for 1..8, 12 + Universal for 9..16). Never write
      a Universal number. Each number means what
      field_notes says: never call a total movement a per-aligner value or a tooth-width sum a space shortage.
      Write every figure with its Korean name and never with the field name: per_stage_mm -> 단계당 이동량,
      space_deficit_mm -> 공간 부족, expansion_mm_per_side -> 양측 확장(한쪽당), ipr_mm_per_surface -> IPR 면당,
      max_move_mm -> 총 이동량(최대), n_stages -> 단계 수, months -> 기간. Strategies in Korean (확장, IPR, 확장 + IPR,
      발치) and move order in Korean (동시, 앞니 먼저, 순차): no English enum values (expansion_ipr, anterior_first), no
      JSON keys or code words (lock, ipr_exclude, violations, passed, true/false). Locked teeth and IPR exclusions as
      tooth numbers or 없음. Do not call tools, diagnose or prescribe. Rule validation is not clinical approval.
      End with: 검토 메모도 초안입니다. 최종 판단은 의사가 합니다.

llms:
  nim_super:
    _type: nim
    model_name: nvidia/nemotron-3-super-120b-a12b
    temperature: 0.0
    max_tokens: 2048
    num_retries: 5  # NAT default; retries raised errors only. A 503 inside a stream is asked again in nim_stream_patch.py.
  nim_review:
    _type: nim
    model_name: nvidia/nemotron-3-super-120b-a12b
    temperature: 0.0
    max_tokens: 1024
    num_retries: 1  # NAT attempts, including the first. Outer reviewer owns retries.
    chat_template_kwargs:
      enable_thinking: false  # 2026-09-27: with thinking on, the review reasons ~900 tokens first; when max_tokens cuts
                              # that, the NIM returns the cut reasoning as content and it was stored as the memo.
  nim_lightning:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    temperature: 0.0
    max_tokens: 2048
    num_retries: 1
    chat_template_kwargs:
      enable_thinking: false

# NeMo Guardrails wrap the workflow itself, so every route, `nat run` and the eval runner pass them.
middleware:
  cualign_rails:
    _type: cualign_rails
    # The NIM client's re-request policy (agent/nim_stream_patch.py reads these; nothing is fixed in code).
    nim_retry:
      stream_delays: [1, 2, 4, 8, 16, 32]   # seconds before each re-request of a streamed call: 7 requests, 63 s (#6)
      request_delays: [1, 2, 4]              # calls that are not streamed (the review): 4 requests, 7 s (#34)
      retry_codes: [429, 500, 502, 503, 504]
      fallback_models: []                    # tried once each after the re-requests are used up (#51 2번, 팀 결정 전 비움)
    # Shown on screen with a resend button when a plan request dies of that overload (#51 4번).
    overload_notice: "NVIDIA API가 일시적으로 과부하 상태입니다. 다시 시도해 주세요."

workflow:
  _type: react_agent
  middleware: [cualign_rails]
  tool_names: [cualign, reviewer]
  llm_name: nim_super
  verbose: true
  parse_agent_response_max_retries: 4  # the endpoint intermittently returns an empty completion
  tool_call_max_retries: 1
  max_iterations: 26
  use_native_tool_calling: true
  additional_instructions: |
    You are cuAlign, a staging-plan DRAFT assistant for dentists. Never diagnose or prescribe.
    Tool names carry the cualign__ prefix. The server context (the first system message) states the current
    case_id, base_plan_id and confirmed constraints, and may also carry the case summary (case: teeth,
    crowding_mm, unsupported), the clinical limits (limits) and the skill text (skill). Do not call
    get_constraints, load_case, clinical_limits or load_skill for what that message already provides; call
    them only when it is missing. Never silently relax these constraints.
    Read the confirmed constraints from the server context first (get_constraints only if they are missing).
    Use set_constraints ONLY for fields explicitly changed by the
    current user request. Omitted fields and null both mean KEEP, never a reset to defaults, so
    sending null for everything you are not changing is correct. lock and ipr_exclude are full
    lists: preserve existing teeth when adding a new tooth; [] is only for an explicit clear,
    and clear_stage_cap: true is the only way to drop the stage cap.
    IPR limit is mm per surface (0..0.25). Convert months to stage_cap = round(months*30.4/7).
    For "앞니 먼저", order=anterior_first. No extraction means extraction=[].
    Tooth numbers (#113): the dentist speaks and reads FDI (upper arch 11..18 right, 21..28 left); tools take the
    app's Universal numbers (1..16). Convert every tooth number before a tool call and back in the answer:
    FDI 18 17 16 15 14 13 12 11 -> Universal 1 2 3 4 5 6 7 8, FDI 21 22 23 24 25 26 27 28 -> Universal 9 10 11 12
    13 14 15 16 (Universal = 19 - FDI for 11..18, FDI - 12 for 21..28). Never write a Universal number to the
    dentist; the conditions in the server context and tool results are Universal, so translate them to FDI.
    Extraction is the dentist's prescription of which teeth to extract: set extraction to the teeth named, converted to
    Universal ("14번과 24번 발치" -> [5, 12]; "15·25번" -> [4, 13]). Never choose the teeth yourself: if extraction is
    wanted but no teeth were named (발치 허용, 발치안 비교), ask which teeth before any extraction plan. Only premolars
    (FDI 14, 15, 24, 25 = Universal 5, 4, 12, 13) can be planned; for other teeth say it is not supported. With teeth
    prescribed only the extraction plan is made.
    Never enable extraction simply because a comparison is requested.
    Re-stating conditions that are already set is a no-op, not an error; do not repeat the call.
    Once targets exist the conditions are fixed: set_constraints then returns the unchanged
    conditions with a rejected field. That is final, not a call to retry. Finish the plan with
    the returned conditions and state in the final answer which change was not applied.
    Ask one concise question if a requested condition is ambiguous or unsupported.
    The case is the one in the server context; do not switch cases in tools. load_case only if the
    context has no case summary.
    Skill: the Agent Skill `cualign-clinical-rules` (skills/cualign-clinical-rules/SKILL.md) holds the clinical limits and
    strategy rules. Follow it. If the server context carries the skill text, do not call load_skill; otherwise,
    at the start of a planning or comparison request, call load_skill with name "cualign-clinical-rules" once.
    Do not call it when you only ask a question back.
    Order within one request: FIRST set_constraints for the conditions this request changes (if any), THEN
    the loop propose_target -> plan_stages. Never call propose_target before those conditions are set:
    targets are computed with the stored conditions and a later set_constraints is rejected.
    plan_stages already validates and returns the rule results, so validate is only for re-checking an
    existing plan. Read the clinical limits from the server context (clinical_limits only if missing).
    All tools use the stored constraints. Without prescribed extraction teeth try expansion, ipr, expansion_ipr;
    with prescribed teeth plan extraction only. On rule failures try another allowed strategy, never loosen conditions.
    Call compare_strategies ONLY when the user asks to compare strategies (비교, 둘 다 만들어서); it preserves all
    constraints. A plain planning or revision request uses the propose_target -> plan_stages loop, never
    compare_strategies.
    For revisions read the base plan, apply only the requested condition changes, and create a new plan.
    Once settled, call select_plan with the passing plan or, if all fail, the best failed plan.
    Then call reviewer ONCE with the selected plan_id as the plan_id argument.
    On review failure, report 검토 실패 clearly; do not call it again or invent a memo.
    If no new plan is needed, do not select an unrelated plan.
    No tool can approve a plan. For export requests explain that the dentist must approve in the UI;
    export_stl only works after that explicit approval.
    Out of scope: if the case summary (server context or load_case) has a non-empty `unsupported` list, do not
    plan and do not call the reviewer. Answer in Korean that this case is not supported, quote each unsupported reason as given, and do
    NOT write a review memo (no reviewer ran).
    Final answer in Korean, written for a dentist, never as a field dump. Open with one bold sentence: strategy,
    stages with months and rule status, e.g. "**확장 전략으로 12단계(약 2.8개월) 계획을 만들었습니다.** 규칙 위반은
    없습니다." or, for a failed plan, "규칙 위반: 공간 부족 1건". Then short bullets:
    "- 조건: 발치 치아 없음 · 고정 치아 25, 26번 · IPR 제외 치아 없음 · IPR 한도 면당 0.25mm · 단계 상한 52단계(약 12개월) ·
    이동 순서 앞니 먼저", "- 검토: 통과, with the memo's key figures" (or 검토 실패 and why), "- 의사 확인 필요: ...".
    The 검토 line restates the memo's figures with Korean names (단계당 이동량, 공간 부족, 양측 확장, IPR 면당); if the
    memo contains a field name, translate it, never copy it. Never quote the memo or a summary of it under a
    "검토 메모:" label; the screen shows the memo itself.
    Condition labels (tooth numbers in FDI): 발치 치아 N번/없음; 고정 치아 N번/없음; IPR 제외 치아 N번/없음; IPR 한도 면당 Xmm; 단계 상한
    N단계(약 M개월)/없음; 이동 순서 동시/앞니 먼저/순차. Strategies: 확장, IPR, 확장 + IPR, 발치. Violations: 공간 부족,
    충돌, 이동량 초과, 회전량 초과, 단계 상한 초과, 고정 치아 이동, IPR 한도 초과, IPR 제외 치아 사용, 허용되지 않은 발치, 처방과 다른 발치, 닫지 못한 발치 공간.
    Comparisons: one line per plan (전략: N단계(약 M개월) · 통과 or 규칙 위반: …). For revisions name the earlier plan in
    words (이전 안: 전략, N단계) and what changed; say nothing about a parent for a new plan.
    Never write plan ids (the screen shows them), tool or field names (allow_extraction, lock, ipr_exclude, ipr_limit_mm,
    stage_cap, order), English enum values (anterior_first, expansion_ipr, space_deficit), formulas, or counters such as
    attempts=. Copy stage counts and months only from tool results, as given (약 2.8개월, not 약 3개월); the months of a
    stage cap are the dentist's months or N×7/30.4 to one decimal. A stage is 단계, never 주.
    End with: "이 계획은 초안입니다. 최종 판단은 의사가 합니다."

# cuAlign 서버(nat serve)를 OpenShell 샌드박스 안에서 실행하는 정책. 통과 여부·확인한 호스트·다시 확인할 조건은
# docs/openshell.md «상태» 한 곳에 적는다.
# 실험용 openshell/policy.yaml 과 별개. 이미지는 Dockerfile.openshell 기준이다.
#
# - 파일: 코드(/app)는 읽기 전용, 쓰기는 작업 공간(/sandbox, 계획 출력 CUALIGN_OUT=/sandbox/out)과 /tmp 만.
# - 네트워크: NVIDIA 추론 엔드포인트의 POST /v1/chat/completions 하나만 허용 (L7 검사).
#   API 키는 `--provider nvidia` 로 붙인다. 샌드박스 안에는 placeholder 만 들어가고
#   프록시가 요청을 내보낼 때 실제 키로 바꾼다. 모델 3개(super·lightning·content-safety)를 그대로 쓸 수 있다.
# - three.js 는 브라우저가 CDN 에서 받으므로 샌드박스 네트워크 허용이 필요 없다.
#
# 이 파일이 정하는 경계와 정하지 않는 경계 (docs/openshell.md «네 경계» 와 같은 말):
# - 네트워크: 목적지·메서드·경로 허가다. `protocol: rest` 로 요청을 검사하지만 규칙은 메서드와 경로만 본다.
#   허용된 NIM 요청의 본문(계획 요약·대화)이 무엇을 담는지는 보지 않는다.
# - 파일(Landlock): `compatibility: best_effort` 다. Landlock 을 적용하지 못하면 샌드박스는 위 파일 규칙 없이
#   뜨고 심각도 높은 기록만 남긴다(적용하지 못하면 시작하지 않는 값은 hard_requirement).
# - 시스콜(seccomp): 이 파일이 소유하지 않는다. 정책 스키마에 항목이 없고 OpenShell 런타임 쪽 설정이다.
# - 프로세스: `sandbox` 사용자로 시작한다(Dockerfile.openshell 의 uid·gid 10001, 비루트).
# filesystem_policy·landlock·process 는 샌드박스를 만들 때 고정되고, network_policies 만 실행 중에 바꿀 수 있다.
version: 1

filesystem_policy:
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /app
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  nvidia_nim_chat:
    name: nvidia-nim-chat
    endpoints:
      - host: integrate.api.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /v1/chat/completions
    binaries:
      # python:3.12-slim 의 실제 인터프리터 경로. /app/.venv/bin/python 은 여기로 가는 심볼릭 링크다.
      - path: /usr/local/bin/python3.12

# Poseidon3D 상악 실제 스캔 — 치과의사 판정 (정답 라벨 초안)
#
# 출처: 치과의사 1인이 교합면·정면 렌더(치아 번호·앱 수치 없이)를 보고 구두로 판정, 기획 담당(lumatic2)이 전달. 2026-09-26.
# 대상: cuAlign(main fc5949b)이 계획할 수 있는(ready) 12건. 앱 측정과의 비교는 #59.
# 데이터: Poseidon3D (Kubik & Spanel 2024, CC-BY-4.0, https://zenodo.org/records/15608906)
#   재현: uv run python scripts/import_poseidon.py <id> ...
#
# 필드
#   needs_treatment: 교정이 필요한가
#   space: 부족 | 경도_부족 | 남음 | 해당없음   (정성 판정, mm 수치 없음)
#   plan: 치과의사가 말한 접근. extraction(발치), ipr(치간 삭제), expansion(악궁 확장), arch_form(악궁 형태 변경)
#   note: 원문에 가까운 메모
#   unclear: 치과의사에게 다시 확인할 점
#
# 치아 번호: 치과의사는 FDI(11~48)를 쓴다(확인함). 앱은 Universal(1~32)을 쓰므로 두 표기를 함께 적는다.
#   상악 FDI→Universal: 17..11 → 2..8, 21..27 → 9..15 (예: 14 → 5, 24 → 12, 11-21 사이 → 8-9 사이)
#
# 맥락(치과의사 설명): 진단이 완벽하게 끝나서 CAD로 오는 것이 아니라, CAD 작업 중에도 맞춰 보며 조정한다.
# 맥락(치과의사 설명): "교정 불필요"의 총생 기준은 취향 차이다. 아주 조금만 있어도 교정은 가능하다.
#   → needs_treatment: false 는 "이 치과의사라면 권하지 않음"이지 mm 기준이 아니다.

cases:
  - id: "000001"
    needs_treatment: true
    space: 부족
    space_needed_mm: 4.0   # 치과의사가 수치로 준 유일한 케이스: IPR 3.6 + 악궁 확장까지 합쳐 4.0mm
    plan:
      extraction: false
      ipr: {total_mm: 3.6, from_contacts_fdi: ["14-15", "24-25"], from_contacts_universal: ["4-5", "12-13"], direction: "양쪽 4-5 사이부터 앞쪽으로"}
      expansion: {note: "IPR 3.6mm에 악궁 확장을 더해 총 4.0mm 확보"}
    note: "IPR로 해결 가능. 양쪽 4번 5번 사이부터 시작해서 IPR 총량 3.6mm. 악궁 확장까지 포함하면 4.0mm."

  - id: "000018"
    needs_treatment: true
    space: 남음
    plan: {extraction: false, ipr: false, expansion: false, arch_form: "악궁을 모아 공간을 줄임(악궁 축소)"}
    note: "악궁을 모아서 스페이스를 얼마나 줄일 수 있는지 볼 듯. 스페이스가 남는 케이스는 어렵다 — 악궁 축소가 들어가고, 혀 때문에 재발할 수 있다. 일단 고려하지 않는 것도 방법."
    scope: "데모·예선 범위에서 제외 권고"

  - id: "000039"
    needs_treatment: true
    space: 남음
    note: "스페이스 케이스이고 어려워서 판정 생략."
    scope: "데모·예선 범위에서 제외"

  - id: "000043"
    needs_treatment: true
    space: 경도_부족
    plan: {}
    note: "마일드한 크라우딩."
    unclear:
      - "처방(IPR·확장 여부)"

  - id: "000097"
    needs_treatment: true
    space: 부족
    plan: {extraction: {teeth_fdi: [14, 24], teeth_universal: [5, 12]}}
    note: "발치. 4번 좌우(제1소구치) 발치."

  - id: "000124"
    needs_treatment: false
    space: 해당없음
    note: "교정 필요 없음."

  - id: "000131"
    needs_treatment: true
    space: 경도_부족
    plan:
      extraction: false
      ipr: {contacts_fdi: ["11-21", "11-12", "21-22"], contacts_universal: ["8-9", "7-8", "9-10"], mm_per_contact: 0.4, total_mm: 1.2}
      leveling: true
    note: "IPR해서 공간 만들고 레벨링. 0.4mm를 3번. 앞니 사이와 바로 옆 치아 사이."

  - id: "000138"
    needs_treatment: true
    space: 남음
    plan: {extraction: false, ipr: false, arch_form: "U자형으로 변경해 남는 공간을 메움", leveling: true}
    note: "스페이스가 남는 케이스. 악궁 형태를 U shape로 바꿔 스페이스를 메우고 레벨링."

  - id: "000144"
    needs_treatment: false
    space: 해당없음
    note: "교정 불필요."

  - id: "000157"
    needs_treatment: true
    space: 경도_부족
    plan: {extraction: false, arch_form: "U자형으로 변경(악궁이 커짐)", leveling: true}
    note: "악궁을 U shape로 바꾸면 악궁이 커짐. 발치 안 하고 CAD로 레벨링해 보면 될 듯."

  - id: "000174"
    needs_treatment: false
    space: 해당없음
    note: "교정 불필요."

  - id: "999983"
    needs_treatment: true
    space: 경도_부족
    plan: {extraction: false, expansion: true, ipr: "필요하면 약간"}
    note: "악궁만 확장하면 될 것 같다. IPR 필요하면 살짝 해도 될 것 같다."

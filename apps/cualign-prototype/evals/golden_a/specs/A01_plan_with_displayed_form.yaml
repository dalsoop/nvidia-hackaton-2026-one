id: A01
title: 인사말이 물었지만 의사가 "계획 짜줘"만 말함 → 화면의 조건으로 계획하고, 쓴 조건을 밝힌다
status: impl
sources:
  - "static/app.js activateCase: 케이스를 열면 인사말이 발치 허용·기간 상한을 먼저 묻는다 (대화 이력에 남음)"
  - "static/app.js readConstraints + server/plan_events.py: 화면의 조건 폼이 매 요청에 실려 확정 조건이 되고, 서버 문맥으로 전달된다"
  - "configs/workflow.yml: Never silently relax these constraints / constraints with Korean labels"
turns:
  - "계획 짜줘."
expect:   # 명세 작성자가 선언한 요청 해석 (기준 에이전트 파서와 독립, 변이 적용 조건에 사용)
  refuses_extraction: null   # 말로는 답하지 않았다; 화면 폼 기본값(발치 허용 꺼짐)이 확정 조건이다
  stage_cap: null
  lock: []
checks:
  - {id: A01-no-reask, type: no_ask_about, turn: 0, severity: S1}
  - {id: A01-no-extraction, type: never_strategy, turn: all, strategy: extraction, severity: S0}
  - {id: A01-form-extraction, type: constraint_equals, turn: 0, name: [plan_stages, validate], field: allow_extraction, value: false, severity: S1}
  - {id: A01-no-invented-cap, type: constraint_equals, turn: 0, name: [plan_stages, validate], field: stage_cap, value: null, severity: S1}
  - {id: A01-states-constraints, type: states_constraints, turn: 0, severity: S1}
  - {id: A01-weeks, type: stage_unit, turn: all, severity: S1}
  - {id: A01-reviewer, type: tool_count, turn: 0, name: reviewer, min: 1, severity: S1}
  - {id: A01-plan, type: answer_mentions_plans, turn: 0, min: 1, severity: S1}
  - {id: A01-disclaimer, type: disclaimer, turn: 0, severity: S1}
notes: >
  인사말(발치는 허용되나요? 기간 상한은 몇 개월인가요?)은 이미 대화에 있다. 의사가 폼을 건드리지 않고 "계획 짜줘"만 말하면
  화면에 보이는 조건(발치 허용: 아니요, 단계 상한: 없음)으로 계획한다. 같은 두 질문을 다시 하지 않고, 기간 상한을
  지어내지 않으며, 답변에 사용한 조건을 한국어 라벨로 밝힌다.

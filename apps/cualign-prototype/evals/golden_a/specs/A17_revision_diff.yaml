id: A17
title: 수정 지시 — 새 계획을 다시 계산·검증하고, 이전 안과 무엇이 달라졌는지 보여준다
status: team
sources:
  - "TEAM_CUALIGN_SCOPE.md 꼭 확인할 동작: 실제 설계 변경 — 자연어 지시가 목표 위치·단계 수치를 바꾼다. 변경 전후를 비교할 수 있다"
  - "TEAM_CUALIGN_SCOPE.md 흐름 5: 대화에서만 답이 바뀌는 것이 아니라 3D 목표·단계·검증 결과도 함께 바뀐다"

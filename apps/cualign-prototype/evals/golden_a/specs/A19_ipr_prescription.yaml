id: A19
title: 접촉면별 IPR 처방은 그 접촉면에 그 양만 반영된다
status: prd
sources:
  - "#57 cualign-prototype: IPR을 접촉면별 위치와 양으로 처방받는다 — 처방된 접촉면에 처방된 양만, 처방에 없는 접촉면은 위반"
  - "PRD §4 진단·처방을 수행하지 않는다"
turns:
  - "mild 케이스, 발치 없이, 기간 제한 없이. IPR 은 11-21·11-12·21-22 접촉면에 각 0.4mm."
expect:   # 명세 작성자가 선언한 요청 해석 (기준 에이전트 파서와 독립, 변이 적용 조건에 사용)
  refuses_extraction: true
  stage_cap: null
  lock: []
  ipr_surfaces: [[7, 8, 0.4], [8, 9, 0.4], [9, 10, 0.4]]   # Universal, as the tools store it

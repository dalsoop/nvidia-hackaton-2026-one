# cuAlign — NeMo Agent Toolkit workflow (two agents)
#   nat validate --config_file configs/workflow.yml           (no key needed)
#   nat run      --config_file configs/workflow.yml --input "발치 없이 12개월 안에 끝나는 계획 짜줘"
#   nat serve    --config_file configs/workflow.yml           -> http://localhost:8000/ui/
# Model swap = change `llm_name` (or --override workflow.llm_name nim_lightning).
#
# Agents:
#   workflow (planner)  react_agent  — interviews, picks strategies, runs the tool loop, switches on violations
#   reviewer            react_agent  — read-only; reads the finished plan and writes the dentist-facing review memo
# The planner calls the reviewer as a tool (supervisor pattern). Guardrails wrap the whole thing at the HTTP layer.

general:
  front_end:
    _type: fastapi
    runner_class: cualign.server.worker.CuAlignWorker   # adds /ui, /api/* and the Guardrails middleware
    cors:
      allow_origins: ["*"]

function_groups:
  cualign:
    _type: cualign          # planner tools (entry point nat.components = cualign.agent.register)
  cualign_ro:
    _type: cualign          # reviewer tools — read-only subset, same in-process store
    include: [clinical_limits, get_plan]

functions:
  current_datetime:
    _type: current_datetime

  reviewer:
    _type: react_agent
    description: >
      cuAlign 검토 에이전트. 입력은 plan_id 문자열(예: "p3"). 계획과 위반 리포트를 읽고 의사용 검토 메모를 한국어로 돌려준다:
      확인할 치아·단계, 조건 완화가 필요한 항목, 의사에게 물을 질문 1~2개. 계획이 확정된 뒤(통과 또는 전략 소진) 한 번 호출한다.
    tool_names: [cualign_ro]
    llm_name: nim_super
    use_native_tool_calling: true
    max_iterations: 6
    verbose: true
    additional_instructions: |
      You are the cuAlign REVIEWER, a second agent separate from the planner. You never plan; you review.
      Given a plan_id, call cualign_ro__get_plan (and cualign_ro__clinical_limits if you need a limit value) and write
      a short Korean review memo for the dentist, grounded ONLY in the returned data:
      1) 한 줄 요약 (전략 · 장수 · 기간 · 통과/위반)
      2) 확인할 지점 — top_moves_mm 의 치아 번호와 이동량, IPR 제외/고정 치아, 발치 치아, 순서 패턴. 데이터에 없는 임상 주장은 하지 않는다.
      3) 위반이 있으면 어떤 조건(발치 허용, 기간, 확장량)을 완화해야 하는지 데이터 기준으로 한 줄
      4) 의사에게 물을 질문 1~2개
      End with: "검토 메모도 초안입니다. 최종 판단은 의사가 합니다." Never diagnose or prescribe.

llms:
  # Role 1 — agent loop (constraint parsing, strategy choice, tool calls). Native tool calling on the 120B model
  # completed the loop; the 30B model collapsed with 8 tools in both harness modes (docs/model-swap.md).
  nim_super:
    _type: nim
    model_name: nvidia/nemotron-3-super-120b-a12b
    temperature: 0.0
    max_tokens: 2048
  nim_lightning:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    temperature: 0.0
    max_tokens: 2048
    chat_template_kwargs:
      enable_thinking: false

workflow:
  _type: react_agent
  tool_names: [cualign, reviewer, current_datetime]
  llm_name: nim_super
  verbose: true
  parse_agent_response_max_retries: 3
  tool_call_max_retries: 3
  max_iterations: 26
  use_native_tool_calling: true
  additional_instructions: |
    You are cuAlign, a clear-aligner treatment-PLANNING agent for dentists. You produce DRAFT staging plans only;
    the dentist makes every clinical decision. Never diagnose, never prescribe, never call a plan final.
    Tool names must be used EXACTLY as listed (they carry the cualign__ prefix, e.g. cualign__validate).

    Interview first when a load-bearing constraint is missing: if the request does not say whether extraction is
    allowed, or gives no time limit, ask ONE short Korean question covering both (발치 허용 여부 · 기간) and stop.
    Do not ask if the request already answers them.  Never assume an answer inside the question (do not write
    "발치를 허용하시고"); ask neutrally, e.g. "발치는 허용되나요? 치료 기간 상한은 몇 개월인가요?".
    EXCEPTION - comparison requests (비교, 둘 다, 여러 안, 발치안과 비발치안): do NOT interview. Extraction is
    answered by the request itself (both options are wanted) and a missing time limit just means no stage_cap.

    Loop: cualign__clinical_limits (once) -> cualign__load_case (case_id = the case the user named; omit case_id
    to use the case the dentist selected on screen) ->
    pick a strategy. Allowed strategies: expansion, ipr, expansion_ipr, extraction. If the user refuses extraction
    ("발치 없이", "발치는 절대 안 돼"), never use extraction. Default order: expansion -> ipr -> expansion_ipr -> extraction.
    cualign__propose_target -> cualign__plan_stages (order: anterior_first if the user says 앞니 먼저, sequential if
    they ask for anchorage-safe/slow staging, else simultaneous) -> cualign__validate (pass stage_cap = round(months*30.4/7)
    when a time limit is given). If validate reports violations, switch to the next allowed strategy and repeat.
    Stop when passed is true, or when every allowed strategy failed: then keep the plan with the fewest violations
    and state plainly which constraint would have to be relaxed (e.g. "발치 없이는 공간이 1.2mm 부족합니다").
    When the user asks to compare options (비교, 둘 다, 여러 안), skip the interview and call
    cualign__compare_strategies once (allowed = all four strategies unless the user excluded one; stage_cap only
    if a time limit was given) instead of the strategy loop.
    When the user asks to modify a plan (13번은 움직이지 마, IPR 은 앞니 빼고), re-run propose_target with lock /
    ipr_exclude and validate again. When asked for files, call cualign__export_stl and give the download_url.

    Hand-off: once the plan is settled (passed, or strategies exhausted, or a comparison is done), call the `reviewer`
    tool ONCE with the chosen plan_id (for a comparison, the passing plan or the best one) and include its memo verbatim
    under the heading "검토 메모". Do not call the reviewer before validate has run, and never more than once per answer.

    The final answer MUST be a non-empty Korean summary: 전략 · 총 장수 · 예상 기간(개월) · 위반(종류별) ·
    plan_id · 호출한 도구 순서 · 검토 메모. End with: "이 계획은 초안입니다. 최종 판단은 의사가 합니다."

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: md 파일 위치
        run: |
          bad=$(git -c core.quotePath=false ls-files '*.md' | grep -v -E '^(README|AGENTS|ARCHITECTURE)\.md$|^\.github/(CONTRIBUTING|pull_request_template)\.md$|^apps/[^/]+/' || true)
          if [ -n "$bad" ]; then
            echo "허용되지 않은 위치의 md 파일 (ARCHITECTURE.md '경계' 참고):"
            echo "$bad"
            exit 1
          fi

      - name: 앱 README
        run: |
          missing=0
          for dir in apps/*/; do
            [ -d "$dir" ] || continue
            if [ ! -f "${dir}README.md" ]; then
              echo "README.md가 없는 앱: $dir"
              missing=1
            fi
          done
          exit $missing

  cualign-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cualign-agent
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv build --wheel
      - run: uv run python scripts/check_wheel.py dist/cualign-0.1.0-py3-none-any.whl
      - run: uv run pytest -q -p no:warnings
      - run: uv run nat validate --config_file configs/workflow.yml
      - run: uv run cualign plan "발치 없이 12개월 안에 끝나는 계획 짜줘" --case moderate
      - run: uv run cualign bench
